<text x="990.0" y="418" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Immediate backup</text>
<text x="24" y="481" text-anchor="start" font-size="17" fill="#52647d" font-weight="400">Illustrative AC design. Voltages and topology vary; redundant paths and UPS bypass are omitted.</text>
