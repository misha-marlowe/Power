<rect x="20" y="110" width="180" height="150" rx="12" fill="#f0f4fc" stroke="#7a94bd" stroke-width="1.5"/>
<text x="110.0" y="141" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">Utility grid</text>
<text x="110.0" y="174" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">230 kV AC</text>
<text x="110.0" y="198" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">example supply</text>
<rect x="240" y="110" width="180" height="150" rx="12" fill="#f0f4fc" stroke="#7a94bd" stroke-width="1.5"/>
<text x="330.0" y="141" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">Substation</text>
<text x="330.0" y="174" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">230 → 34.5 kV</text>
<text x="330.0" y="198" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">on-site or off-site</text>
<rect x="460" y="110" width="180" height="150" rx="12" fill="#f0f4fc" stroke="#7a94bd" stroke-width="1.5"/>
<text x="550.0" y="141" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">Building</text>
<text x="550.0" y="166" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">transformers</text>
<text x="550.0" y="199" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">34.5 kV → 480 V</text>
<text x="550.0" y="223" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">example voltages</text>
