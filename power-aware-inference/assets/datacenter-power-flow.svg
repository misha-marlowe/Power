<text x="550.0" y="394" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Separate circuits</text>
<text x="550.0" y="418" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Backup varies</text>
<rect x="680" y="330" width="180" height="110" rx="12" fill="#ecf8f2" stroke="#349574" stroke-width="1.5"/>
<text x="770.0" y="361" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">Generators</text>
<text x="770.0" y="394" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Fuel → electricity</text>
<text x="770.0" y="418" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Standby backup</text>
<rect x="900" y="330" width="180" height="110" rx="12" fill="#ecf8f2" stroke="#349574" stroke-width="1.5"/>
<text x="990.0" y="361" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">Batteries</text>
