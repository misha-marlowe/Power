<text x="990.0" y="174" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Conditions power;</text>
<text x="990.0" y="198" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">bridges outages</text>
