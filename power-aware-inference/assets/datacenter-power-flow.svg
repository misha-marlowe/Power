<text x="1210.0" y="198" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">PSU: AC → DC</text>
<text x="1210.0" y="222" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Regulators → chips</text>
<rect x="460" y="330" width="180" height="110" rx="12" fill="#f0f4fc" stroke="#7a94bd" stroke-width="1.5"/>
