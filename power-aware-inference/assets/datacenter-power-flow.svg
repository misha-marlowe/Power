<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="510" viewBox="0 0 1320 510" role="img" aria-labelledby="title desc">
<title id="title">Datacenter power: grid to GPU</title>
<desc id="desc">Utility grid feeds a substation, building transformers, transfer switchgear, UPS, then rack distribution and server power supplies. Standby generators feed transfer switchgear. Batteries charge from and discharge into the UPS. Cooling uses separate circuits from the transfer switchgear.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647d"/></marker></defs>
<rect width="1320" height="510" rx="18" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" font-size="27" font-weight="700" fill="#14243b">Datacenter power: grid to GPU</text>
<text x="24" y="70" font-size="18" fill="#52647d">Normal supply → voltage conversion → source selection → backup protection → computing</text>

