<text x="770.0" y="141" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">Transfer +</text>
<text x="770.0" y="166" text-anchor="middle" font-size="21" fill="#14243b" font-weight="700">switchgear</text>
<text x="770.0" y="199" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">Select source;</text>
<text x="770.0" y="223" text-anchor="middle" font-size="17" fill="#52647d" font-weight="400">protect circuits</text>
<rect x="900" y="110" width="180" height="150" rx="12" fill="#ecf8f2" stroke="#349574" stroke-width="1.5"/>
